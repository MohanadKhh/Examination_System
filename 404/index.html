<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <style type="text/tailwindcss">
      @theme {
        --color-primary: #2662d9;
        --color-secondary: #47b4eb;
        --color-border: hsl(220 15% 88%);
        --color-title: hsl(220 25% 15%);
        --color-subtitle: hsl(220 15% 45%);
        --color-focus: hsl(220 90% 56%);
        --color-destructive: #e02424;
        --color-warning: #f59e0b;
        --color-muted: hsl(220 15% 96%);
        --font-inter: "Inter", sans-serif;
        --animate-fade-slide-in: fade-slide-in 0.5s ease-out forwards;
      }

      @font-face {
        font-family: "Inter";
        src: url("/assets/fonts/inter-VariableFont_opsz,wght.ttf")
          format("truetype");
        font-weight: 100 900;
        font-style: normal;
      }

      @keyframes fade-slide-in {
        0% {
          opacity: 0;
          transform: translateY(20px);
        }
        100% {
          opacity: 1;
          transform: translateY(0px);
        }
      }
    </style>
    <script src="/js/router/auth.js"></script>
    <script src="/js/router/navigation.js"></script>
    <script src="/js/main.js"></script>
    <link rel="icon" type="image/svg" href="/assets/icons/logo.svg" />
    <title>ExamPro - Page Not Found</title>
  </head>
  <body
    class="m-0 p-0 box-border font-inter max-h-screen bg-gradient-to-r from-primary to-secondary opacity-0"
  >
    <div
      class="flex justify-center items-center h-full min-h-screen p-4 overflow-hidden"
    >
      <div
        class="w-full max-w-lg p-8 border border-border rounded-xl shadow-md bg-white/95 animate-fade-slide-in text-center"
      >
        <div
          class="w-24 h-24 mx-auto mb-6 bg-destructive/10 rounded-full flex items-center justify-center"
        >
          <svg
            xmlns="http://www.w3.org/2000/svg"
            width="48"
            height="48"
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="2"
            stroke-linecap="round"
            stroke-linejoin="round"
            class="text-destructive"
          >
            <circle cx="12" cy="12" r="10"></circle>
            <path d="m15 9-6 6"></path>
            <path d="m9 9 6 6"></path>
          </svg>
        </div>

        <h1 class="text-8xl font-bold text-primary mb-2">404</h1>

        <h2 class="text-2xl font-bold text-title mb-3">Page Not Found</h2>

        <p class="text-subtitle text-base mb-8 max-w-sm mx-auto">
          Oops! The page you're looking for doesn't exist or has been moved to
          another location.
        </p>

        <div class="flex flex-col sm:flex-row gap-4 justify-center">
          <button
            class="flex items-center justify-center gap-2 px-6 py-3 bg-white border-2 border-primary text-primary font-semibold rounded-lg hover:bg-primary/10 transition-colors cursor-pointer"
            onclick="history.back()"
          >
            <svg
              xmlns="http://www.w3.org/2000/svg"
              width="18"
              height="18"
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="2"
              stroke-linecap="round"
              stroke-linejoin="round"
            >
              <path d="m12 19-7-7 7-7"></path>
              <path d="M19 12H5"></path>
            </svg>
            Go Back
          </button>

          <a
            href="/register/"
            class="flex items-center justify-center gap-2 px-6 py-3 bg-primary text-white font-semibold rounded-lg border-2 border-primary hover:bg-primary/90 transition-colors cursor-pointer"
          >
            <svg
              xmlns="http://www.w3.org/2000/svg"
              width="18"
              height="18"
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="2"
              stroke-linecap="round"
              stroke-linejoin="round"
            >
              <path d="M15 21v-8a1 1 0 0 0-1-1h-4a1 1 0 0 0-1 1v8"></path>
              <path
                d="M3 10a2 2 0 0 1 .709-1.528l7-5.999a2 2 0 0 1 2.582 0l7 5.999A2 2 0 0 1 21 10v9a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"
              ></path>
            </svg>
            Back to Home
          </a>
        </div>
      </div>
    </div>
    <script>
      showPage();
    </script>
  </body>
</html>
